<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas Relay Demo</title>
  <style>
    :root {
      --bg: #0f1216;
      --panel: #171b21;
      --line: #2a313c;
      --text: #e7ecf3;
      --muted: #8b97a8;
      --accent: #3d9cf0;
      --ok: #3dd68c;
      --warn: #e6b450;
      --err: #f07178;
      --user: #2a3a4d;
      --agent: #1c242e;
      --tool: #243028;
      --pick: #24364a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
    a.nav {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      flex: none;
    }
    a.nav:hover { color: var(--text); border-color: var(--accent); }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
    select {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font: inherit;
      min-width: 180px;
    }
    .row {
      display: flex; gap: 8px; align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: #12161c;
    }
    .row label { color: var(--muted); font-size: 12px; width: 84px; flex: none; }
    .row.actions { justify-content: flex-end; }
    details.fold {
      background: #12161c;
      border-bottom: 1px solid var(--line);
    }
    details.fold > summary {
      cursor: pointer;
      list-style: none;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }
    details.fold > summary::-webkit-details-marker { display: none; }
    details.fold > summary::before {
      content: "▸";
      display: inline-block;
      width: 1.1em;
      color: var(--text);
    }
    details.fold[open] > summary::before { content: "▾"; }
    details.fold > .row { border-bottom-color: transparent; }
    details.fold > .row:last-child { border-bottom: 0; }
    .row button { padding: 6px 12px; font-size: 13px; }
    .row select { flex: 1; min-width: 0; }
    .row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      font: inherit;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 860px;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.md { white-space: normal; }
    .msg.md p { margin: 0 0 .55em; }
    .msg.md p:last-child { margin-bottom: 0; }
    .msg.md h1, .msg.md h2, .msg.md h3, .msg.md h4, .msg.md h5, .msg.md h6 {
      margin: .2em 0 .45em;
      line-height: 1.25;
      font-weight: 650;
    }
    .msg.md h1 { font-size: 1.25em; }
    .msg.md h2 { font-size: 1.12em; }
    .msg.md h3, .msg.md h4 { font-size: 1.05em; }
    .msg.md ul, .msg.md ol { margin: .35em 0 .55em; padding-left: 1.35em; }
    .msg.md li { margin: .15em 0; }
    .msg.md li input { margin-right: 6px; vertical-align: middle; }
    .msg.md pre {
      background: #0c1016;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: .45em 0;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
    }
    .msg.md code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      background: #0c1016;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg.md pre code { background: none; padding: 0; }
    .msg.md blockquote {
      margin: .4em 0;
      padding: 2px 0 2px 12px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .msg.md table { border-collapse: collapse; margin: .5em 0; max-width: 100%; }
    .msg.md th, .msg.md td {
      border: 1px solid var(--line);
      padding: 4px 8px;
      text-align: left;
    }
    .msg.md th { background: #12161c; }
    .msg.md a { color: var(--accent); }
    .msg.md img { max-width: 100%; border-radius: 6px; }
    .msg.md hr { border: 0; border-top: 1px solid var(--line); margin: .7em 0; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--line); }
    .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: transparent; }
    .msg.err { align-self: center; color: var(--err); font-size: 12px; }
    .msg.tool { align-self: flex-start; background: var(--tool); color: #b7d5c0; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
    .msg .tag { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .think { color: var(--muted); font-style: italic; }
    footer {
      position: relative;
      display: flex; gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      background: var(--accent);
      color: #061018;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    button.ghost.active {
      color: var(--text);
      border-color: var(--accent);
    }
    .slash-menu {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(100% - 4px);
      max-height: 280px;
      overflow-y: auto;
      background: #141920;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, .35);
      padding: 6px;
      display: none;
      z-index: 15;
    }
    .slash-menu.open { display: block; }
    .slash-item, .cmd-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .slash-item:hover, .slash-item.on, .cmd-item:hover {
      background: var(--pick);
    }
    button.cmd-item {
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      font: inherit;
    }
    .slash-item .name, .cmd-item .name {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
    }
    .slash-item .desc, .cmd-item .desc {
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .03em;
      color: var(--muted);
      border: 1px solid var(--line);
      vertical-align: middle;
    }
    .badge.skill { color: #8fd4b8; border-color: #2f5a48; }
    .badge.flow { color: #e6c27a; border-color: #5a4a28; }
    .badge.page { color: var(--accent); border-color: #2a4c6a; }
    #cmdPanel, #histPanel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(420px, 100%);
      background: var(--panel);
      border-left: 1px solid var(--line);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .16s ease;
    }
    #cmdPanel.open, #histPanel.open { transform: translateX(0); }
    .cmd-head, .cmd-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .cmd-head strong { font-size: 14px; }
    .cmd-head .meta { margin-left: auto; }
    .cmd-tabs { padding-top: 8px; padding-bottom: 8px; }
    .cmd-tabs button { padding: 5px 10px; font-size: 12px; }
    #cmdFilter {
      margin: 10px 14px 0;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    #cmdList, #histList {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px 16px;
    }
    .cmd-empty, .cmd-hint {
      color: var(--muted);
      font-size: 12px;
      padding: 12px 14px;
    }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; }
      .meta { width: 100%; margin-left: 0; }
      select { min-width: 0; max-width: 100%; }
      .row { flex-wrap: wrap; }
      .row label { width: 100%; }
      footer { flex-wrap: wrap; }
      textarea { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="agentDot"></span>
    <h1>Atlas Relay Chat</h1>
    <a class="nav" id="toMobile" href="/m">手机版</a>
    <select id="agentSel" title="选择要对话的 Agent">
      <option value="">选择 Agent…</option>
    </select>
    <span class="meta" id="status">等待 CLI 出站连接…</span>
  </header>
  <details class="fold" id="setupFold" open>
  <summary>会话与派工</summary>
  <div class="row">
    <label>cwd</label>
    <input id="cwd" placeholder="该 Agent 机器上的绝对路径，例如 E:\work\mygit\architechure\grok-build" />
  </div>
  <div class="row">
    <label>模型</label>
    <select id="modelId" title="与 atlas /model 同一份目录">
      <option value="">默认（Agent 启动模型）</option>
    </select>
    <button class="ghost" id="applyModelBtn" type="button">应用</button>
  </div>
  <div class="row">
    <label>会话 id</label>
    <input id="sessionId" placeholder="UUID。新建时写入 _meta.sessionId；载入已有会话时作为 session/load 的 id" />
    <button class="ghost" id="newSessionBtn" type="button">新建</button>
    <button class="ghost" id="loadSessionBtn" type="button">载入</button>
    <button class="ghost" id="histBtn" type="button">历史</button>
  </div>
  <div class="row">
    <label>jobId</label>
    <input id="jobId" placeholder="派工编号，例如 pay-20260901" />
  </div>
  <div class="row">
    <label>需求 URL</label>
    <input id="reqUrl" placeholder="https://…/requirements.md" />
  </div>
  <div class="row">
    <label>设计 URL</label>
    <input id="designUrl" placeholder="https://…/detailed-design.md" />
  </div>
  <div class="row">
    <label>验收 URL</label>
    <input id="acceptUrl" placeholder="https://…/acceptance.md" />
  </div>
  </details>
  <div class="row actions">
    <button class="ghost" id="sampleBtn" type="button">填入示例 URL</button>
    <button id="dispatchBtn" type="button" disabled>开始派工</button>
  </div>
  <div id="log"></div>
  <aside id="histPanel" aria-hidden="true">
    <div class="cmd-head">
      <strong>历史会话</strong>
      <span class="meta" id="histCount"></span>
      <button class="ghost" id="histClose" type="button">关闭</button>
    </div>
    <p class="cmd-hint">列出该 Agent 上、当前 cwd 附近的会话（含 headless）。点一条填入会话 id 和 cwd，并载入。</p>
    <div id="histList"></div>
  </aside>
  <aside id="cmdPanel" aria-hidden="true">
    <div class="cmd-head">
      <strong>斜杠命令</strong>
      <span class="meta" id="cmdCount"></span>
      <button class="ghost" id="cmdClose" type="button">关闭</button>
    </div>
    <div class="cmd-tabs">
      <button class="ghost active" id="tabAll" type="button">全部</button>
      <button class="ghost" id="tabSkill" type="button">技能</button>
      <button class="ghost" id="tabBuiltin" type="button">内置</button>
    </div>
    <input id="cmdFilter" placeholder="筛选名称、说明或插件" />
    <div id="cmdList"></div>
    <p class="cmd-hint">点一项填入输入框，再 Enter 发给本机 Agent。TUI 的 /skills 不会弹窗，本页用 ACP 目录代替。</p>
  </aside>
  <footer>
    <div id="slashMenu" class="slash-menu" role="listbox" aria-label="斜杠命令"></div>
    <button class="ghost" id="cancelBtn" type="button" disabled>停止</button>
    <button class="ghost" id="cmdBtn" type="button">命令</button>
    <textarea id="input" placeholder="就绪后输入 / 可补全。/skills 打开技能面板。Enter 发送，Shift+Enter 换行"></textarea>
    <button id="sendBtn" type="button" disabled>发送</button>
  </footer>
  <script src="/md.js"></script>
  <script src="/slash.js"></script>
  <script>
    document.getElementById("toMobile").href = "/m" + location.search;
  </script>
  <script src="/chat.js"></script>
</body>
</html>
