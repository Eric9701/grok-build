<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#171b21" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Atlas Relay</title>
  <style>
    :root {
      --bg: #0f1216;
      --panel: #171b21;
      --line: #2a313c;
      --text: #e7ecf3;
      --muted: #8b97a8;
      --accent: #3d9cf0;
      --ok: #3dd68c;
      --user: #2a3a4d;
      --agent: #1c242e;
      --tool: #243028;
      --pick: #24364a;
      --err: #f07178;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: var(--vvh, 100dvh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    header {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    h1 {
      margin: 0;
      flex: 1;
      min-width: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    a.nav {
      flex: none;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    #agentSel, .row input, .row select, #cmdFilter, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
    }
    #agentSel { min-height: 44px; padding: 8px 10px; }
    #status, .meta {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; max-width: 88%; background: var(--user); }
    .msg.agent {
      align-self: flex-start;
      background: var(--agent);
      border: 1px solid var(--line);
    }
    .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: transparent; text-align: center; }
    .msg.err { align-self: center; color: var(--err); font-size: 12px; text-align: center; }
    .msg.tool {
      align-self: flex-start;
      background: var(--tool);
      color: #b7d5c0;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
    }
    .msg .tag { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .think { color: var(--muted); font-style: italic; }
    .msg.md { white-space: normal; overflow-x: auto; }
    .msg.md p { margin: 0 0 .55em; }
    .msg.md p:last-child { margin-bottom: 0; }
    .msg.md h1, .msg.md h2, .msg.md h3, .msg.md h4, .msg.md h5, .msg.md h6 {
      margin: .2em 0 .45em;
      line-height: 1.25;
      font-weight: 650;
    }
    .msg.md h1 { font-size: 1.2em; }
    .msg.md h2 { font-size: 1.1em; }
    .msg.md h3, .msg.md h4 { font-size: 1.02em; }
    .msg.md ul, .msg.md ol { margin: .35em 0 .55em; padding-left: 1.25em; }
    .msg.md li { margin: .15em 0; }
    .msg.md pre {
      background: #0c1016;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: .45em 0;
      font: 12px/1.45 ui-monospace, "SF Mono", Consolas, monospace;
    }
    .msg.md code {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
      background: #0c1016;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg.md pre code { background: none; padding: 0; }
    .msg.md blockquote {
      margin: .4em 0;
      padding: 2px 0 2px 12px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .msg.md table { border-collapse: collapse; margin: .5em 0; display: block; overflow-x: auto; }
    .msg.md th, .msg.md td {
      border: 1px solid var(--line);
      padding: 4px 8px;
      text-align: left;
    }
    .msg.md th { background: #12161c; }
    .msg.md a { color: var(--accent); }
    .msg.md img { max-width: 100%; border-radius: 6px; }
    .msg.md hr { border: 0; border-top: 1px solid var(--line); margin: .7em 0; }
    details.fold {
      flex: none;
      max-height: min(52dvh, 420px);
      background: #12161c;
      border-top: 1px solid var(--line);
    }
    details.fold[open] {
      height: min(52dvh, 420px);
      overflow: hidden;
    }
    details.fold:not([open]) { max-height: none; }
    .sheet {
      display: flex;
      flex-direction: column;
      height: calc(min(52dvh, 420px) - 44px);
      overflow: hidden;
    }
    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-actions {
      flex: none;
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      background: #12161c;
    }
    .sheet-actions button { flex: 1; min-height: 44px; }
    details.fold > summary {
      position: sticky;
      top: 0;
      z-index: 1;
      cursor: pointer;
      list-style: none;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--muted);
      font-size: 13px;
      background: #12161c;
      user-select: none;
    }
    details.fold > summary::-webkit-details-marker { display: none; }
    details.fold > summary::before {
      content: "▸";
      width: 1.1em;
      color: var(--text);
    }
    details.fold[open] > summary::before { content: "▾"; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 4px 12px 8px;
    }
    .row label { width: 100%; color: var(--muted); font-size: 12px; }
    .row input, .row select {
      flex: 1 1 100%;
      min-width: 0;
      min-height: 44px;
      padding: 8px 10px;
    }
    .row button { flex: 1; min-height: 44px; }
    footer {
      position: relative;
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr;
      gap: 8px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    textarea {
      grid-column: 1 / -1;
      grid-row: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 10px 12px;
    }
    #cancelBtn { grid-column: 1; grid-row: 2; }
    #cmdBtn { grid-column: 2; grid-row: 2; }
    #sendBtn { grid-column: 3; grid-row: 2; }
    button {
      background: var(--accent);
      color: #061018;
      border: 0;
      border-radius: 10px;
      min-height: 44px;
      padding: 0 12px;
      font: inherit;
      font-weight: 650;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 550;
    }
    button.ghost.active {
      color: var(--text);
      border-color: var(--accent);
    }
    .slash-menu {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(100% + 6px);
      max-height: min(46dvh, 320px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #141920;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, .35);
      padding: 6px;
      display: none;
      z-index: 15;
    }
    .slash-menu.open { display: block; }
    .slash-item, .cmd-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      min-height: 44px;
      justify-content: center;
    }
    .slash-item.on, .cmd-item:active { background: var(--pick); }
    button.cmd-item {
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      font: inherit;
      font-weight: 450;
      border-radius: 10px;
    }
    .slash-item .name, .cmd-item .name {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 14px;
    }
    .slash-item .desc, .cmd-item .desc {
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .03em;
      color: var(--muted);
      border: 1px solid var(--line);
      vertical-align: middle;
    }
    .badge.skill { color: #8fd4b8; border-color: #2f5a48; }
    .badge.flow { color: #e6c27a; border-color: #5a4a28; }
    .badge.page { color: var(--accent); border-color: #2a4c6a; }
    #cmdPanel, #histPanel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      background: var(--panel);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .16s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #cmdPanel.open, #histPanel.open { transform: translateX(0); }
    .cmd-head, .cmd-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .cmd-head strong { font-size: 16px; flex: 1; }
    .cmd-tabs { padding-top: 8px; padding-bottom: 8px; }
    .cmd-tabs button { flex: 1; min-height: 44px; font-size: 14px; }
    #cmdFilter { margin: 10px 12px 0; min-height: 44px; padding: 8px 10px; }
    #cmdList, #histList {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 8px 16px;
    }
    .cmd-empty, .cmd-hint {
      color: var(--muted);
      font-size: 13px;
      padding: 12px;
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <span class="dot" id="agentDot"></span>
      <h1>Atlas Relay</h1>
      <a class="nav" id="toDesk" href="/build">桌面版</a>
    </div>
    <select id="agentSel" title="选择要对话的 Agent">
      <option value="">选择 Agent…</option>
    </select>
    <p id="status">等待 CLI 出站连接…</p>
  </header>
  <div id="log"></div>
  <details class="fold" id="setupFold">
    <summary>会话与派工</summary>
    <div class="sheet">
    <div class="sheet-body">
    <div class="row">
      <label>cwd</label>
      <input id="cwd" enterkeyhint="done" placeholder="该 Agent 机器上的绝对路径" />
    </div>
    <div class="row">
      <label>模型</label>
      <select id="modelId" title="与 atlas /model 同一份目录">
        <option value="">默认（Agent 启动模型）</option>
      </select>
      <button class="ghost" id="applyModelBtn" type="button">应用</button>
    </div>
    <div class="row">
      <label>会话 id</label>
      <input id="sessionId" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="UUID。空则新建时由 Agent 生成" />
      <button class="ghost" id="newSessionBtn" type="button">新建</button>
      <button class="ghost" id="loadSessionBtn" type="button">载入</button>
      <button class="ghost" id="histBtn" type="button">历史</button>
    </div>
    <div class="row">
      <label>jobId</label>
      <input id="jobId" enterkeyhint="done" placeholder="派工编号，例如 pay-20260901" />
    </div>
    <div class="row">
      <label>需求 URL</label>
      <input id="reqUrl" inputmode="url" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/requirements.md" />
    </div>
    <div class="row">
      <label>设计 URL</label>
      <input id="designUrl" inputmode="url" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/detailed-design.md" />
    </div>
    <div class="row">
      <label>验收 URL</label>
      <input id="acceptUrl" inputmode="url" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/acceptance.md" />
    </div>
    </div>
    <div class="sheet-actions">
      <button class="ghost" id="sampleBtn" type="button">填入示例</button>
      <button id="dispatchBtn" type="button" disabled>开始派工</button>
    </div>
    </div>
  </details>
  <aside id="histPanel" aria-hidden="true">
    <div class="cmd-head">
      <strong>历史会话</strong>
      <span class="meta" id="histCount"></span>
      <button class="ghost" id="histClose" type="button">关闭</button>
    </div>
    <p class="cmd-hint">列出该 Agent 上、当前 cwd 附近的会话（含 headless）。点一条填入会话 id 和 cwd，并载入。</p>
    <div id="histList"></div>
  </aside>
  <aside id="cmdPanel" aria-hidden="true">
    <div class="cmd-head">
      <strong>斜杠命令</strong>
      <span class="meta" id="cmdCount"></span>
      <button class="ghost" id="cmdClose" type="button">关闭</button>
    </div>
    <div class="cmd-tabs">
      <button class="ghost active" id="tabAll" type="button">全部</button>
      <button class="ghost" id="tabSkill" type="button">技能</button>
      <button class="ghost" id="tabBuiltin" type="button">内置</button>
    </div>
    <input id="cmdFilter" enterkeyhint="search" placeholder="筛选名称、说明或插件" />
    <div id="cmdList"></div>
    <p class="cmd-hint">点一项填入输入框，再发送给本机 Agent。</p>
  </aside>
  <footer>
    <div id="slashMenu" class="slash-menu" role="listbox" aria-label="斜杠命令"></div>
    <textarea id="input" rows="1" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="输入消息。/ 补全，/skills 打开命令"></textarea>
    <button class="ghost" id="cancelBtn" type="button" disabled>停止</button>
    <button class="ghost" id="cmdBtn" type="button">命令</button>
    <button id="sendBtn" type="button" disabled>发送</button>
  </footer>
  <script src="/md.js"></script>
  <script src="/slash.js"></script>
  <script>
    document.getElementById("toDesk").href = "/build" + location.search;
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      function pin() {
        document.body.style.height = vv.height + "px";
        document.body.style.top = vv.offsetTop + "px";
      }
      vv.addEventListener("resize", pin);
      vv.addEventListener("scroll", pin);
      pin();
    })();
  </script>
  <script src="/chat.js"></script>
</body>
</html>
