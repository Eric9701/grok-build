<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas Login</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { max-width: 28rem; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; }
    .box { border: 1px solid #8884; border-radius: 8px; padding: 1.25rem; }
    label { display: block; margin: 0.75rem 0 0.35rem; }
    input[type=text], input[type=email], input[type=password] {
      width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem; font-size: 1rem;
    }
    button { margin-top: 1rem; padding: 0.55rem 1rem; cursor: pointer; }
    .err { color: #c33; margin-top: 1rem; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 1rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Sign in to Atlas</h1>
  <p>You must sign in before approving a device code.</p>
  <div class="box">
    <form method="post" action="/atlas/login">
      <input type="hidden" name="next" value="{{.Next}}" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
    {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
    <p class="hint">请联系管理员或条线负责人开通账户</p>
  </div>
</body>
</html>
